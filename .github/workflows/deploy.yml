name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the HEAD commit message for a (major)/(minor)/(patch) prefix and
      # bumps package.json accordingly, committing with [skip ci] so this push
      # doesn't retrigger a deploy or another bump. No prefix = no bump. See
      # the root CLAUDE.md's Versioning section for the policy this enforces.
      - name: Bump version from commit message prefix
        run: |
          MSG=$(git log -1 --pretty=%B)
          BUMP=""
          if [[ "$MSG" =~ ^\(major\) ]]; then BUMP=major
          elif [[ "$MSG" =~ ^\(minor\) ]]; then BUMP=minor
          elif [[ "$MSG" =~ ^\(patch\) ]]; then BUMP=patch
          fi
          if [[ -n "$BUMP" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version "$BUMP" --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"
            git push origin HEAD:main
          else
            echo "No version prefix in commit message — skipping bump."
          fi

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Host ssh.lampham.space
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy
        run: |
          ssh lpham@ssh.lampham.space "
            cd /var/www/status.lampham.space &&
            git fetch origin main &&
            git reset --hard origin/main &&
            printf 'DATABASE_URL=%s\nJWT_SECRET=%s\nGITHUB_TOKEN=%s\n' '${{ secrets.DATABASE_URL }}' '${{ secrets.JWT_SECRET }}' '${{ secrets.GH_API_TOKEN }}' > .env &&
            npm ci &&
            npm run migrate &&
            npm run build &&
            sudo systemctl restart status
          "
